[project]
name = "mohlakoana-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) as a default value is the standard FastAPI pattern.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # generated/hand-written DDL, not worth wrapping
"tests/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # avoid confusion with the local ./alembic/ directory

[tool.pytest.ini_options]
pythonpath = ["."]
